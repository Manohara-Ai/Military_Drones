# Clock synchronization (Gazebo → ROS)
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Quadrotor Velocity Command (ROS → Gazebo)
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "quadrotor/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# Enable Controller (ROS → Gazebo)
- ros_topic_name: "/enable"
  gz_topic_name: "quadrotor/enable"
  ros_type_name: "std_msgs/msg/Bool"
  gz_type_name: "gz.msgs.Boolean"
  direction: ROS_TO_GZ

# Joint States (Gazebo → ROS)
- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/surveillance_world/model/quadrotor/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS
